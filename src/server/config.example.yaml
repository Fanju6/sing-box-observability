server:
  listen: 127.0.0.1:9095
  trusted_proxies: []
  secure_cookie: false
console:
  auth_token: ""
  session_ttl: 24h
singbox:
  name: local
  base_url: http://127.0.0.1:9090
  token: ""
collector:
  scrape_interval: 2s
  persist_interval: 15s
  reconcile_interval: 3s
  stale_after: 30s
storage:
  path: ./data/observability.db
  retention: 168h
