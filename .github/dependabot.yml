version: 2
updates:
  - package-ecosystem: gomod
    directory: /src/server
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
