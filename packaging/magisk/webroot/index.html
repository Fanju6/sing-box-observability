<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>sing-box Observability</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #171717;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111210;
          color: #f1f1ed;
        }
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }

      main {
        width: min(100%, 360px);
        text-align: center;
      }

      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 20px;
        border: 2px solid color-mix(in srgb, currentColor 18%, transparent);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 600;
      }

      p {
        min-height: 42px;
        margin: 0;
        color: color-mix(in srgb, currentColor 65%, transparent);
        font-size: 14px;
        line-height: 1.5;
      }

      .actions {
        display: none;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }

      button, a {
        min-height: 40px;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        border-radius: 8px;
        padding: 9px 14px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-decoration: none;
      }

      button { cursor: pointer; }

      @keyframes spin { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>sing-box Observability</h1>
      <p id="status" role="status">正在启动面板…</p>
      <div class="actions" id="actions">
        <button id="retry" type="button">重试</button>
        <a href="http://127.0.0.1:9095/">直接打开</a>
      </div>
    </main>

    <script>
      (() => {
        'use strict'

        const panelUrl = 'http://127.0.0.1:9095/'
        const controller = '/data/adb/modules/sing-box-observability/bin/sing-box-observabilityctl'
        const status = document.querySelector('#status')
        const actions = document.querySelector('#actions')
        const retry = document.querySelector('#retry')

        function showFailure(message) {
          status.textContent = message
          actions.style.display = 'flex'
          document.querySelector('.spinner').style.display = 'none'
        }

        function openPanel() {
          actions.style.display = 'none'
          status.textContent = '正在启动面板…'

          try {
            if (window.ksu && typeof window.ksu.exec === 'function') {
              window.ksu.exec(`${controller} start >/dev/null 2>&1`)
              const result = window.ksu.exec(`${controller} status 2>/dev/null`)
              if (!result.includes('is running')) {
                showFailure('服务没有成功启动，请查看模块日志后重试。')
                return
              }
            }
            window.location.replace(panelUrl)
          } catch (error) {
            showFailure('无法连接本地面板，请确认模块已启用并重新启动设备。')
          }
        }

        retry.addEventListener('click', openPanel)
        openPanel()
      })()
    </script>
  </body>
</html>
